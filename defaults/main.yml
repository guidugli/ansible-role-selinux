---
# defaults file for selinux

# Desired SELinux mode: disabled, permissive, or enforcing.
selinux_state: enforcing

# Desired SELinux policy. Debian-family systems normally use default;
# RedHat-family systems normally use targeted.
selinux_policy: "{{ _selinux_policy[ansible_facts['os_family']] | default(_selinux_policy['default']) }}"

# Reboot the host when SELinux configuration changes and a reboot is required.
selinux_reboot: true

# CIS validation profile for this role.
# - none: keep the role flexible and allow all module-supported SELinux states/policies.
# - level1: require SELinux to be installed and not disabled; on RedHat-family targets,
#           require the CIS-approved targeted or mls policy.
# - level2: include level1 checks and require enforcing mode.
selinux_cis_profile: none
