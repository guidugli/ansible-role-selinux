---
# vars file for selinux

_selinux_requirements:
  default: []
  Debian:
    - selinux-basics
    - selinux-utils
    - python3-selinux
    - python3-semanage
    - selinux-policy-default
    - policycoreutils
  RedHat:
    - python3-libselinux
    - python3-libsemanage
    - python3-policycoreutils
    - policycoreutils-python-utils
    - "selinux-policy-{{ selinux_policy }}"

selinux_requirements: >-
  {{
    _selinux_requirements[ansible_facts['os_family']]
    | default(_selinux_requirements['default'])
  }}

_selinux_policy:
  default: targeted
  Debian: default
