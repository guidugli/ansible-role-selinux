---
# tasks file for selinux
- name: Include SELinux variable validation
  ansible.builtin.include_tasks: assert.yml
  run_once: true
  tags:
    - selinux
    - validate

- name: Install SELinux packages
  ansible.builtin.package:
    name: "{{ selinux_requirements }}"
    state: present
    update_cache: true
  when:
    - selinux_requirements | length > 0
  tags:
    - selinux
    - install

- name: Manage SELinux state and policy
  ansible.posix.selinux:
    state: "{{ selinux_state }}"
    policy: "{{ selinux_policy }}"
  notify:
    - Reboot
  when:
    - ansible_facts.get('selinux', {}).get('status', 'missing') != 'missing'
    - ansible_connection not in ['docker', 'container', 'containers.podman.podman']
  tags:
    - selinux
    - config
